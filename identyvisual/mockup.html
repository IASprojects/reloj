<style>
        body {
            background-color: transparent;
        }
        
        /* Neon Glow Effect */
        .neon-glow-container {
            border: 1.5px solid var(--tw-colors-neon-blue, #00f0ff);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15), inset 0 0 15px rgba(0, 240, 255, 0.05);
            transition: all 0.3s ease;
        }
        
        .neon-glow-container.neon-off {
            border-color: #3A3A3A;
            box-shadow: none;
        }

        /* Flip Clock Specifics */
        .flip-card {
            background-color: #1a1c1c;
            border: 1px solid #3A3A3A;
            position: relative;
            overflow: hidden;
        }
        
        .flip-bisect {
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 1px;
            background-color: #121212;
            z-index: 10;
        }
        
        .flip-card-inner {
            background: linear-gradient(to bottom, #292a2a 0%, #1b1c1c 100%);
        }

        /* Custom Toggle */
        .neon-toggle:checked {
            background-color: var(--tw-colors-neon-blue, #00f0ff);
            border-color: var(--tw-colors-neon-blue, #00f0ff);
        }
        
        .ghost-button {
            border: 1px solid #444748;
            transition: all 0.2s;
        }

            color: #00f0ff;

<script>
        // Simple Clock Logic
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('hours').textContent = h;
            document.getElementById('minutes').textContent = m;
            document.getElementById('seconds').textContent = s;
        }

        setInterval(updateClock, 1000);
        updateClock();

        // Neon Toggle Logic
        const toggle = document.getElementById('neonToggle');
        const widget = document.getElementById('main-widget');
        const statusDot = document.getElementById('status-dot');

        toggle.addEventListener('change', (e) => {
            if (e.target.checked) {
                widget.classList.remove('neon-off');
                statusDot.classList.remove('bg-outline-variant', 'shadow-none');
                statusDot.classList.add('bg-[#00f0ff]', 'shadow-[0_0_5px_rgba(0,240,255,0.8)]');
            } else {
                widget.classList.add('neon-off');
                statusDot.classList.remove('bg-[#00f0ff]', 'shadow-[0_0_5px_rgba(0,240,255,0.8)]');
                statusDot.classList.add('bg-outline-variant', 'shadow-none');
            }
        });
    </script>
